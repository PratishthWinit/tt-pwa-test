<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>TAMTAM Web Test</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TT Test">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --bg:#f4f3ef; --card:#fff; --text:#1c1c1e; --muted:#6e6e73; --tint:#ff2d55; --line:rgba(120,120,128,.25); --ok:#1f9d55; --bad:#d70015; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --muted:#98989f; --line:rgba(120,120,128,.35); --ok:#30d158; --bad:#ff453a; } }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 -apple-system, system-ui, sans-serif;
         padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  h1 { font-size:22px; margin:4px 0 12px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:22px 4px 8px; }
  .card { background:var(--card); border-radius:16px; padding:12px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button { font:600 15px -apple-system, system-ui; border:0; border-radius:12px; padding:10px 14px; background:var(--tint); color:#fff; }
  button.ghost { background:transparent; color:var(--tint); border:1px solid var(--line); }
  #pad { display:block; width:100%; height:55vh; min-height:320px; border-radius:12px; background:var(--bg); touch-action:none; border:1px solid var(--line); }
  .stats { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:6px 14px; margin-top:10px; font:13px ui-monospace, Menlo, monospace; }
  .stats b { color:var(--muted); font-weight:500; }
  .status { margin:8px 0; font-size:14px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  textarea { width:100%; height:110px; font:11px ui-monospace, Menlo, monospace; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); padding:8px; -webkit-user-select:text; user-select:text; }
  label { font-size:14px; display:flex; gap:6px; align-items:center; }
</style>
</head>
<body>
<h1>TAMTAM web test</h1>
<div id="mode" class="status"></div>
<p><a href="draw.html" style="color:var(--tint);font-weight:600">Open the Sketch app (pen, highlighter, eraser, undo) ›</a></p>

<h2>1 · Apple Pencil</h2>
<div class="card">
  <canvas id="pad"></canvas>
  <div class="row" style="margin-top:10px">
    <button id="clear">Clear</button>
    <label><input type="checkbox" id="penOnly" checked> Ignore fingers when Pencil seen (palm rejection)</label>
    <label><input type="checkbox" id="predict" checked> Show predicted ink</label>
    <button id="report" class="ghost">Copy results</button>
  </div>
  <div class="stats" id="stats"></div>
</div>

<h2>2 · Notifications</h2>
<div class="card">
  <div id="nstatus" class="status"></div>
  <div class="row">
    <button id="enable">Enable notifications</button>
    <button id="local" class="ghost">Test: show one now</button>
    <button id="badge" class="ghost">Test: badge 3</button>
    <button id="unbadge" class="ghost">Clear badge</button>
  </div>
  <p style="font-size:13px;color:var(--muted)">Real push test: after enabling, tap Copy and send the text to the PC. Then lock the phone and run the sender there.</p>
  <textarea id="sub" readonly placeholder="Push subscription appears here after enabling"></textarea>
  <div class="row" style="margin-top:8px"><button id="copy" class="ghost">Copy subscription</button></div>
</div>

<script>
// ---------- Pencil ----------
const pad = document.getElementById('pad');
const ctx = pad.getContext('2d', { desynchronized: true }); // low-latency hint
const css = getComputedStyle(document.documentElement);
let ink = '#1c1c1e', predictInk = 'rgba(255,45,85,.45)';
const fit = () => {
  const r = pad.getBoundingClientRect(), d = devicePixelRatio || 1;
  pad.width = r.width * d; pad.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.lineCap = ctx.lineJoin = 'round';
  ink = matchMedia('(prefers-color-scheme: dark)').matches ? '#f2f2f7' : '#1c1c1e';
};
fit(); addEventListener('resize', fit);

const s = { type: '-', pressure: 0, tilt: '-', angle: '-', hz: 0, coalesced: 0, predicted: 0, delay: 0, hover: 'no', rejected: 0 };
let penSeen = false, last = null, lastT = 0, rateN = 0, rateT = performance.now(), delays = [], predictedSnap = null;
const statsEl = document.getElementById('stats');
const render = () => {
  statsEl.innerHTML = [
    ['input', s.type], ['pressure', s.pressure.toFixed(3)], ['tilt x/y', s.tilt], ['altitude/azimuth', s.angle],
    ['events/sec', s.hz], ['in-between pts', s.coalesced], ['predicted pts', s.predicted],
    ['input delay ms', s.delay.toFixed(1)], ['hover', s.hover], ['palms ignored', s.rejected],
  ].map(([k, v]) => `<div><b>${k}</b> ${v}</div>`).join('');
};
render();

const pos = (e) => { const r = pad.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, p: e.pointerType === 'pen' ? e.pressure : 0.5 }; };
const seg = (a, b, color) => { ctx.strokeStyle = color; ctx.lineWidth = 0.8 + b.p * 6; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); };
const deg = (r) => (r * 180 / Math.PI).toFixed(0) + '°';

function track(e) {
  s.type = e.pointerType; s.pressure = e.pressure;
  s.tilt = `${e.tiltX ?? '-'} / ${e.tiltY ?? '-'}`;
  s.angle = e.altitudeAngle != null ? `${deg(e.altitudeAngle)} / ${deg(e.azimuthAngle)}` : 'n/a';
  // timeStamp and performance.now() share a clock: gap = time from input to our handler
  delays.push(performance.now() - e.timeStamp); if (delays.length > 60) delays.shift();
  s.delay = delays.reduce((a, b) => a + b, 0) / delays.length;
  rateN++; const now = performance.now(); if (now - rateT > 1000) { s.hz = Math.round(rateN * 1000 / (now - rateT)); rateN = 0; rateT = now; }
  render();
}

const rejected = (e) => {
  if (e.pointerType === 'pen') penSeen = true;
  if (document.getElementById('penOnly').checked && penSeen && e.pointerType === 'touch') { s.rejected++; render(); return true; }
  return false;
};

let restore = null; // canvas pixels before the predicted ink was drawn
pad.addEventListener('pointerdown', (e) => {
  if (rejected(e)) return;
  e.preventDefault(); pad.setPointerCapture(e.pointerId);
  last = pos(e); restore = null; track(e);
});
pad.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'pen' && e.buttons === 0) { s.hover = `yes (${Math.round(e.clientX)},${Math.round(e.clientY)})`; render(); return; }
  if (!last || rejected(e)) return;
  e.preventDefault();
  if (restore) { ctx.putImageData(restore, 0, 0); restore = null; } // wipe last guess
  const pts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  s.coalesced = pts.length;
  for (const c of (pts.length ? pts : [e])) { const p = pos(c); seg(last, p, ink); last = p; }
  const pred = document.getElementById('predict').checked && e.getPredictedEvents ? e.getPredictedEvents() : [];
  s.predicted = e.getPredictedEvents ? pred.length : 'n/a';
  if (pred.length) {
    restore = ctx.getImageData(0, 0, pad.width, pad.height);
    let a = last; for (const c of pred) { const p = pos(c); seg(a, p, predictInk); a = p; }
  }
  track(e);
});
const up = () => { if (restore) { ctx.putImageData(restore, 0, 0); restore = null; } last = null; };
pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up);
pad.addEventListener('pointerleave', () => { s.hover = 'no'; render(); });
document.getElementById('clear').onclick = () => { ctx.clearRect(0, 0, pad.width, pad.height); s.rejected = 0; render(); };
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false }); // stop page bounce while drawing

document.getElementById('report').onclick = async () => {
  const t = `TAMTAM pencil test\n${statsEl.innerText}\n${navigator.userAgent}`;
  try { await navigator.clipboard.writeText(t); alert('Copied. Paste it in WhatsApp.'); } catch { prompt('Copy this:', t); }
};

// ---------- Notifications ----------
const VAPID_PUBLIC = 'BPAhvGIy5VVYJh1j42A5_9txtp69pl1H0WPktrNy1v-AJ7ggvIlRtEGrovzrLhGMKsdfoHYQLdy9SIoCPwGqSr8';
const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
const modeEl = document.getElementById('mode'), nEl = document.getElementById('nstatus'), subEl = document.getElementById('sub');
modeEl.innerHTML = standalone
  ? '<span class="ok">Running as Home Screen app ✓</span>'
  : '<span class="bad">Opened in Safari. For notifications: Share → Add to Home Screen, then open it from the icon.</span>';
const say = (t, ok) => { nEl.innerHTML = `<span class="${ok ? 'ok' : 'bad'}">${t}</span>`; };
say(!('Notification' in window) ? 'Notifications not available here (needs Home Screen app on iOS 16.4+)' : `Permission: ${Notification.permission}`, Notification?.permission === 'granted');

const b64 = (s) => { const p = '='.repeat((4 - s.length % 4) % 4), raw = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, (c) => c.charCodeAt(0)); };
const swReady = 'serviceWorker' in navigator ? navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready) : Promise.reject(new Error('No service worker support'));

document.getElementById('enable').onclick = async () => {
  try {
    const perm = await Notification.requestPermission(); // must run from a tap on iOS
    if (perm !== 'granted') return say('Permission: ' + perm);
    const reg = await swReady;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(VAPID_PUBLIC) });
    subEl.value = JSON.stringify(sub);
    say('Enabled ✓ Push subscription ready', true);
  } catch (e) { say('Failed: ' + e.message); }
};
document.getElementById('local').onclick = async () => {
  try { (await swReady).showNotification('TAMTAM test', { body: 'Notifications show on this device ✓', badge: 'icon-180.png', icon: 'icon-180.png' }); say('Sent a local notification', true); }
  catch (e) { say('Failed: ' + e.message); }
};
document.getElementById('badge').onclick = () => navigator.setAppBadge ? navigator.setAppBadge(3).then(() => say('Badge set to 3 (check the icon)', true), (e) => say('Badge failed: ' + e.message)) : say('Badge API not available');
document.getElementById('unbadge').onclick = () => navigator.clearAppBadge?.();
document.getElementById('copy').onclick = async () => { try { await navigator.clipboard.writeText(subEl.value); say('Copied ✓', true); } catch { subEl.select(); } };
</script>
</body>
</html>
