<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sketchbook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sketchbook">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* Same look as TAMTAM's Draw tab: black chrome, white infinite board, dark blurred docks. */
  :root { --chrome:#000; --text:#fff; --muted:#888; --tint:#ff2d55; --glass:rgba(30,30,32,.82); --edge:rgba(255,255,255,.12); --pop:rgba(36,36,38,.96); --board:#fff; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--chrome); color:var(--text); font:15px -apple-system, system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:center; padding:calc(env(safe-area-inset-top) + 12px) 20px 14px; }
  header h1 { margin:0; font-size:32px; font-weight:900; letter-spacing:-1px; }
  #zoom { font-size:12px; font-weight:700; color:var(--muted); display:flex; gap:5px; align-items:center; }
  #zoom a { color:var(--muted); text-decoration:none; }
  .acts { display:flex; gap:12px; }
  .circle { width:44px; height:44px; border-radius:22px; border:0; display:grid; place-items:center; background:rgba(255,255,255,.1); color:#fff; padding:0; }
  .circle.tint { background:var(--tint); }
  svg.i { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  main { position:relative; flex:1; background:var(--board); overflow:hidden; }
  #board { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }

  .glass { background:var(--glass); backdrop-filter:blur(20px) saturate(1.4); -webkit-backdrop-filter:blur(20px) saturate(1.4); border:1px solid var(--edge); }
  #dock { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 104px); display:flex; gap:6px; padding:6px 10px; border-radius:28px; }
  #dock button { width:44px; height:44px; border:0; background:transparent; color:#fff; display:grid; place-items:center; border-radius:22px; }

  /* PencilKit-style tool picker */
  #picker { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 14px); max-width:calc(100% - 16px);
            border-radius:20px; display:flex; align-items:flex-end; gap:4px; padding:6px 10px 0; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; }
  #picker::-webkit-scrollbar { display:none; }
  .sep { width:1px; align-self:stretch; margin:10px 4px 12px; background:var(--edge); flex:none; }
  .pbtn { flex:none; width:38px; height:38px; margin-bottom:12px; border:0; background:transparent; color:#fff; display:grid; place-items:center; border-radius:10px; }
  .pbtn.on { background:rgba(255,255,255,.16); }
  .tool { flex:none; width:30px; height:66px; border:0; padding:0; background:transparent; transform:translateY(16px); transition:transform .16s ease; }
  .tool.on { transform:translateY(2px); }
  .tool svg { width:30px; height:68px; display:block; }
  .sw { flex:none; width:26px; height:26px; margin:0 3px 18px; border-radius:50%; border:2px solid rgba(255,255,255,.25); padding:0; }
  .sw.on { box-shadow:0 0 0 2px #1c1c1e, 0 0 0 4px #fff; }
  .wheel { background:conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }

  .pop { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 100px); width:min(340px, calc(100% - 24px));
         background:var(--pop); border:1px solid var(--edge); border-radius:18px; padding:14px; display:none; z-index:5; box-shadow:0 12px 40px rgba(0,0,0,.35); }
  .pop.open { display:block; }
  .pop h3 { margin:0 0 10px; font-size:13px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
  .widths { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .wbtn { width:46px; height:46px; border-radius:12px; border:0; background:rgba(255,255,255,.06); display:grid; place-items:center; }
  .wbtn.on { background:rgba(255,255,255,.22); }
  .wbtn i { display:block; border-radius:50%; background:#fff; }
  .seg { display:flex; background:rgba(255,255,255,.08); border-radius:10px; padding:2px; margin-bottom:12px; }
  .seg button { flex:1; border:0; background:transparent; color:#fff; font:600 13px -apple-system, system-ui; padding:7px; border-radius:8px; }
  .seg button.on { background:rgba(255,255,255,.22); }
  .lab { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin:6px 0 4px; }
  input[type=range] { width:100%; accent-color:var(--tint); }
  #grid { display:grid; grid-template-columns:repeat(12, 1fr); border-radius:8px; overflow:hidden; }
  #grid div { aspect-ratio:1; }
  #grid div.on { outline:2px solid #fff; outline-offset:-2px; }
  #spec { width:100%; height:170px; border-radius:8px; display:block; touch-action:none; }
  .row { display:flex; gap:8px; align-items:center; }
  .hex { width:100px; background:rgba(255,255,255,.08); color:#fff; border:0; border-radius:8px; padding:7px 9px; font:13px ui-monospace, Menlo, monospace; -webkit-user-select:text; user-select:text; }
  #saved { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center; }
  #saved button { width:28px; height:28px; border-radius:50%; border:2px solid rgba(255,255,255,.25); padding:0; }
  .mini { border:0; background:rgba(255,255,255,.1); color:#fff; border-radius:9px; padding:7px 11px; font:600 13px -apple-system, system-ui; }
  .toggle { display:flex; justify-content:space-between; align-items:center; padding:8px 0; font-size:15px; }

  #selmenu { position:absolute; display:none; gap:2px; padding:4px; border-radius:12px; background:#2c2c2e; z-index:4; }
  #selmenu button { border:0; background:transparent; color:#fff; font:600 13px -apple-system, system-ui; padding:8px 10px; border-radius:8px; }
  #toast { position:absolute; left:50%; top:16px; transform:translateX(-50%); background:rgba(0,0,0,.82); color:#fff; padding:9px 14px; border-radius:12px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:9; }
  #gallery { position:fixed; inset:0; background:#000; z-index:20; display:none; flex-direction:column; padding-top:env(safe-area-inset-top); }
  #gallery.open { display:flex; }
  .ghead { display:flex; justify-content:space-between; align-items:center; padding:20px 25px; }
  .ghead h2 { margin:0; font-size:22px; font-weight:900; }
  #gitems { flex:1; overflow:auto; display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; padding:0 15px 30px; align-content:start; }
  #gitems img { width:100%; aspect-ratio:1; object-fit:contain; background:#fff; border-radius:20px; display:block; }
  #gview { position:fixed; inset:0; background:#000; z-index:21; display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:20px; }
  #gview.open { display:flex; }
  #gview img { max-width:100%; max-height:75vh; background:#fff; border-radius:24px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Sketchbook</h1>
    <div id="zoom"><span id="ztext">100%</span></div>
  </div>
  <div class="acts">
    <button class="circle" id="bGallery" aria-label="Gallery"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg></button>
    <button class="circle tint" id="bSend" aria-label="Send"><svg class="i" viewBox="0 0 24 24" style="width:20px"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
  </div>
</header>

<main id="wrap">
  <canvas id="board"></canvas>

  <div id="dock" class="glass">
    <button id="bExport" aria-label="Export"><svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg></button>
    <button id="bUndo2" aria-label="Undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button id="bTrash" aria-label="Clear" style="color:#ff3b30"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
  </div>

  <div id="picker" class="glass"></div>

  <div id="popTool" class="pop"></div>
  <div id="popColor" class="pop">
    <div class="seg" id="ctabs"><button data-t="grid" class="on">Grid</button><button data-t="spec">Spectrum</button><button data-t="sliders">Sliders</button></div>
    <div data-p="grid"><div id="grid"></div></div>
    <div data-p="spec" hidden><canvas id="spec"></canvas></div>
    <div data-p="sliders" hidden>
      <div class="lab"><span>Red</span><span id="vr"></span></div><input type="range" id="sr" min="0" max="255">
      <div class="lab"><span>Green</span><span id="vg"></span></div><input type="range" id="sg" min="0" max="255">
      <div class="lab"><span>Blue</span><span id="vb"></span></div><input type="range" id="sb" min="0" max="255">
      <div class="row" style="margin-top:8px"><span style="font-size:13px;color:var(--muted)">Hex</span><input class="hex" id="hex" maxlength="7" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
    </div>
    <div class="lab" style="margin-top:12px"><span>Opacity</span><span id="vop"></span></div>
    <input type="range" id="op" min="5" max="100">
    <div id="saved"></div>
    <div class="row" style="margin-top:12px; justify-content:space-between">
      <button class="mini" id="bDrop">Eyedropper</button>
      <button class="mini" id="bSave">+ Save colour</button>
    </div>
  </div>
  <div id="popMore" class="pop">
    <div class="toggle"><span>Draw with finger</span><input type="checkbox" id="tFinger"></div>
    <div class="toggle"><span>Zoom to 100%</span><button class="mini" id="bReset">Reset</button></div>
    <p style="font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.4">Pencil draws; one finger does nothing once a Pencil is used (palm rejection). Two fingers pan and pinch-zoom. Tap the selected tool again for width and opacity.</p>
  </div>

  <div id="selmenu"><button id="sDup">Duplicate</button><button id="sDel" style="color:#ff453a">Delete</button></div>
  <div id="toast"></div>
</main>

<div id="gallery">
  <div class="ghead"><h2>Gallery</h2><button class="circle" id="gClose" aria-label="Close">✕</button></div>
  <div id="gitems"></div>
</div>
<div id="gview">
  <img id="gimg" alt="">
  <div class="row"><button class="mini" id="gShare">Share</button><button class="mini" id="gDel" style="color:#ff453a">Delete</button><button class="mini" id="gBack">Close</button></div>
</div>

<script type="module">
import { getStroke } from './perfect-freehand.mjs';

const $ = (s) => document.querySelector(s);
const store = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch { return null; } };
const uid = () => Math.random().toString(36).slice(2, 10);

// ---------------- Tools (each keeps its own colour / width / opacity, like PencilKit) ----------------
const TOOL_ORDER = ['pen', 'marker', 'pencil', 'monoline', 'fountain', 'watercolor', 'crayon', 'eraser', 'lasso'];
const NAMES = { pen: 'Pen', marker: 'Marker', pencil: 'Pencil', monoline: 'Monoline', fountain: 'Fountain pen', watercolor: 'Watercolour', crayon: 'Crayon', eraser: 'Eraser', lasso: 'Lasso' };
const WIDTHS = { pen: [1, 2, 3, 5, 8], marker: [6, 10, 14, 20, 28], pencil: [1, 2, 3, 5, 8], monoline: [1, 2, 3, 5, 8], fountain: [2, 3, 4, 6, 9], watercolor: [8, 12, 16, 24, 32], crayon: [4, 6, 8, 12, 16], eraser: [8, 14, 20, 32, 48] };
const DEFAULTS = {
  pen: { color: '#000000', alpha: 1, w: 3 }, marker: { color: '#ffd60a', alpha: 0.6, w: 14 }, pencil: { color: '#000000', alpha: 1, w: 3 },
  monoline: { color: '#000000', alpha: 1, w: 3 }, fountain: { color: '#000000', alpha: 1, w: 4 }, watercolor: { color: '#0a84ff', alpha: 0.5, w: 16 },
  crayon: { color: '#ff3b30', alpha: 1, w: 8 }, eraser: { mode: 'pixel', w: 20 },
};
const tools = Object.assign(structuredClone(DEFAULTS), store('tt-sk-tools') || {});
let tool = store('tt-sk-tool') || 'pen';
const settings = Object.assign({ finger: false }, store('tt-sk-settings') || {});
const QUICK = ['#000000', '#0a84ff', '#34c759', '#ffd60a', '#ff3b30'];
const isInk = (t) => t !== 'eraser' && t !== 'lasso';
let lastInk = isInk(tool) ? tool : 'pen';
const saveTools = () => { store('tt-sk-tools', tools); store('tt-sk-tool', tool); store('tt-sk-settings', settings); };

// ---------------- Board state ----------------
const board = $('#board'), ctx = board.getContext('2d', { desynchronized: true });
const cache = document.createElement('canvas'), cctx = cache.getContext('2d');
let DPR = 1, W = 0, H = 0;
let view = Object.assign({ tx: 0, ty: 0, z: 1 }, store('tt-sk-view') || {});
let cacheView = { ...view };
let strokes = [], undoStack = [], redoStack = [];
let dirty = true;

// ---------------- Ink rendering ----------------
const OPTS = {
  pen: { thinning: 0.6, smoothing: 0.5, streamline: 0.45, end: { taper: true } },
  monoline: { thinning: 0, smoothing: 0.5, streamline: 0.5 },
  fountain: { thinning: 0.85, smoothing: 0.5, streamline: 0.5 },
  marker: { thinning: 0, smoothing: 0.6, streamline: 0.5 },
  pencil: { thinning: 0.5, smoothing: 0.4, streamline: 0.4 },
  crayon: { thinning: 0.25, smoothing: 0.4, streamline: 0.4 },
  watercolor: { thinning: 0.4, smoothing: 0.6, streamline: 0.6 },
  erase: { thinning: 0, smoothing: 0.5, streamline: 0.4 },
};
const svgPath = (pts) => {
  if (!pts.length) return '';
  let d = `M${pts[0][0]},${pts[0][1]} Q`;
  for (let i = 0; i < pts.length; i++) { const [x0, y0] = pts[i], [x1, y1] = pts[(i + 1) % pts.length]; d += `${x0},${y0} ${(x0 + x1) / 2},${(y0 + y1) / 2} `; }
  return d + 'Z';
};
function outline(s, k) {
  let pts = s.pts;
  if (s.tool === 'fountain') { // nib held at 45°: thick across it, thin along it
    pts = pts.map((p, i) => {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      const dir = Math.atan2(b[1] - a[1], b[0] - a[0]);
      return [p[0], p[1], (0.12 + 0.88 * Math.abs(Math.sin(dir - Math.PI / 4))) * (s.real ? 0.4 + 0.6 * p[2] : 1)];
    });
  }
  return getStroke(pts, { size: s.w * k, ...OPTS[s.erase ? 'erase' : s.tool], simulatePressure: !s.real && s.tool !== 'fountain', last: true });
}
function strokePaths(s) {
  const ks = s.tool === 'watercolor' && !s.erase ? [1.35, 1, 0.65] : [s.tool === 'pencil' && s.shade ? 3 : 1];
  return ks.map((k) => new Path2D(svgPath(outline(s, k))));
}
const grainCanvases = new Map();
function grain(color, coarse) {
  const key = color + coarse;
  if (grainCanvases.has(key)) return grainCanvases.get(key);
  const n = coarse ? 224 : 256, c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d'), img = g.createImageData(n, n), [r, gr, b] = rgb(color);
  for (let i = 0; i < n * n; i++) {
    const v = Math.random(), a = coarse ? (v > 0.42 ? 150 + Math.random() * 105 : 0) : (v > 0.3 ? 90 + Math.random() * 165 : 0);
    img.data[i * 4] = r; img.data[i * 4 + 1] = gr; img.data[i * 4 + 2] = b; img.data[i * 4 + 3] = a;
  }
  g.putImageData(img, 0, 0); grainCanvases.set(key, c); return c;
}
function drawStroke(g, s) {
  const paths = s._paths || strokePaths(s);
  g.save();
  if (s.erase) { g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; g.fill(paths[0]); g.restore(); return; }
  const a = s.alpha ?? 1;
  if (s.tool === 'marker') { g.globalCompositeOperation = 'multiply'; g.globalAlpha = a; g.fillStyle = s.color; g.fill(paths[0]); }
  else if (s.tool === 'watercolor') { g.globalCompositeOperation = 'multiply'; g.fillStyle = s.color; [0.22, 0.3, 0.42].forEach((k, i) => { g.globalAlpha = a * k; g.fill(paths[i]); }); }
  else if (s.tool === 'pencil' || s.tool === 'crayon') {
    const pat = g.createPattern(grain(s.color, s.tool === 'crayon'), 'repeat');
    try { pat.setTransform(new DOMMatrix().scale(1 / view.z)); } catch {}
    g.globalAlpha = a * (s.tool === 'pencil' ? (s.shade ? 0.5 : 0.9) : 1); g.fillStyle = pat; g.fill(paths[0]);
  } else { g.globalAlpha = a; g.fillStyle = s.color; g.fill(paths[0]); }
  g.restore();
}
function finalize(s) {
  s._paths = strokePaths(s);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of s.pts) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
  const m = s.w * (s.tool === 'pencil' && s.shade ? 3 : 1.4);
  s._bb = { x0: x0 - m, y0: y0 - m, x1: x1 + m, y1: y1 + m };
  return s;
}
const setXf = (g, v = view) => g.setTransform(DPR * v.z, 0, 0, DPR * v.z, DPR * v.tx, DPR * v.ty);
function rebuild(exclude) {
  cctx.setTransform(1, 0, 0, 1, 0, 0); cctx.clearRect(0, 0, cache.width, cache.height);
  setXf(cctx);
  const vx0 = -view.tx / view.z, vy0 = -view.ty / view.z, vx1 = vx0 + W / view.z, vy1 = vy0 + H / view.z;
  for (const s of strokes) {
    if (exclude?.has(s)) continue;
    const b = s._bb; if (b.x1 < vx0 || b.x0 > vx1 || b.y1 < vy0 || b.y0 > vy1) continue; // off screen
    drawStroke(cctx, s);
  }
  cacheView = { ...view }; dirty = true;
}

// ---------------- History + persistence ----------------
let saveTimer = 0;
const persist = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => { store('tt-sk-strokes', strokes.map(({ _paths, _bb, ...r }) => r)); store('tt-sk-view', view); }, 400); };
const pushUndo = () => { undoStack.push(strokes); if (undoStack.length > 150) undoStack.shift(); redoStack = []; };
function setStrokes(next) { strokes = next; clearSel(); rebuild(); persist(); }
function undo() { if (!undoStack.length) return; redoStack.push(strokes); setStrokes(undoStack.pop()); }
function redo() { if (!redoStack.length) return; undoStack.push(strokes); setStrokes(redoStack.pop()); }
function commit(s) { finalize(s); pushUndo(); strokes = [...strokes, s]; setXf(cctx, cacheView); drawStroke(cctx, s); dirty = true; persist(); }

// ---------------- Ruler (screen space, like PencilKit's) ----------------
const ruler = { on: false, cx: 0, cy: 0, a: -Math.PI / 12, T: 80 };
const toRuler = (x, y) => { const dx = x - ruler.cx, dy = y - ruler.cy, c = Math.cos(-ruler.a), s = Math.sin(-ruler.a); return { u: dx * c - dy * s, v: dx * s + dy * c }; };
const fromRuler = (u, v) => { const c = Math.cos(ruler.a), s = Math.sin(ruler.a); return { x: ruler.cx + u * c - v * s, y: ruler.cy + u * s + v * c }; };
const onRuler = (x, y) => ruler.on && Math.abs(toRuler(x, y).v) < ruler.T / 2;

// ---------------- Selection (lasso) ----------------
let sel = null; // Set of selected strokes
const selBox = () => {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const s of sel) { x0 = Math.min(x0, s._bb.x0); y0 = Math.min(y0, s._bb.y0); x1 = Math.max(x1, s._bb.x1); y1 = Math.max(y1, s._bb.y1); }
  return { x0, y0, x1, y1 };
};
function clearSel() { sel = null; $('#selmenu').style.display = 'none'; dirty = true; }
function showSelMenu() {
  const b = selBox(), m = $('#selmenu');
  m.style.display = 'flex';
  m.style.left = Math.max(8, Math.min(W - 180, view.tx + b.x0 * view.z)) + 'px';
  m.style.top = Math.max(8, view.ty + b.y0 * view.z - 48) + 'px';
}
const inPoly = (x, y, poly) => { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c; } return c; };
const shift = (s, dx, dy) => finalize({ ...s, id: uid(), pts: s.pts.map((p) => [p[0] + dx, p[1] + dy, p[2], p[3]]) });
$('#sDel').onclick = () => { pushUndo(); setStrokes(strokes.filter((s) => !sel.has(s))); };
$('#sDup').onclick = () => {
  const copies = [...sel].map((s) => shift(s, 24 / view.z, 24 / view.z));
  pushUndo(); strokes = [...strokes, ...copies]; rebuild(); persist(); sel = new Set(copies); showSelMenu();
};

// ---------------- Input ----------------
const touches = new Map();
let penSeen = !!store('tt-sk-penSeen'), penDown = false, penUpAt = 0;
let actor = null, live = null, snap = null, lasso = null, moving = null, erasing = null, pinch = null, rulerDrag = null, hover = null, picking = false;
const fingerDraws = () => !penSeen || settings.finger;

$('#hex').onchange = () => { const v = $('#hex').value.trim(); if (/^#?[0-9a-f]{6}$/i.test(v)) setColor((v[0] === '#' ? v : '#' + v).toLowerCase()); syncSliders(); };
$('#op').oninput = () => { tools[lastInk].alpha = $('#op').value / 100; $('#vop').textContent = $('#op').value + '%'; saveTools(); };
let savedColors = store('tt-sk-saved') || [];
function renderColorPop() {
  const ts = tools[lastInk];
  gridEl.querySelectorAll('div').forEach((d) => d.classList.toggle('on', d.dataset.c === ts.color));
  $('#op').value = Math.round(ts.alpha * 100); $('#vop').textContent = Math.round(ts.alpha * 100) + '%';
  $('#saved').innerHTML = savedColors.map((c) => `<button data-c="${c}" style="background:${c}"></button>`).join('') || '<span style="font-size:12px;color:var(--muted)">Saved colours appear here</span>';
  syncSliders();
}
$('#saved').onclick = (e) => { const c = e.target.dataset?.c; if (c) { setColor(c); renderColorPop(); } };
$('#bSave').onclick = () => { const c = tools[lastInk].color; savedColors = [c, ...savedColors.filter((x) => x !== c)].slice(0, 10); store('tt-sk-saved', savedColors); renderColorPop(); };
$('#bDrop').onclick = () => { picking = true; closePops(); toast('Tap the drawing to pick a colour'); };
function pickColor(p) {
  picking = false;
  const d = ctx.getImageData(Math.round(p.x * DPR), Math.round(p.y * DPR), 1, 1).data;
  const a = d[3] / 255, mix = (v) => v * a + 255 * (1 - a); // over the white board
  setColor(hexOf(mix(d[0]), mix(d[1]), mix(d[2])));
}
function setColor(c) {
  if (!isInk(tool)) { tool = lastInk; clearSel(); }
  tools[lastInk].color = c; saveTools(); renderPicker();
}

// ---------------- Dock, header, gallery ----------------
$('#bUndo2').onclick = undo;
$('#bTrash').onclick = () => { if (strokes.length) { pushUndo(); setStrokes([]); } };
$('#tFinger').onchange = () => { settings.finger = $('#tFinger').checked; saveTools(); };
$('#bReset').onclick = () => { view = { tx: 0, ty: 0, z: 1 }; $('#ztext').textContent = '100%'; rebuild(); persist(); closePops(); };

function exportCanvas() {
  const ink = strokes.filter((s) => !s.erase); if (!ink.length) return null;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const s of ink) { x0 = Math.min(x0, s._bb.x0); y0 = Math.min(y0, s._bb.y0); x1 = Math.max(x1, s._bb.x1); y1 = Math.max(y1, s._bb.y1); }
  x0 -= 20; y0 -= 20; x1 += 20; y1 += 20;
  const w = x1 - x0, h = y1 - y0, k = Math.min(3, Math.sqrt(16e6 / (w * h)), 4096 / Math.max(w, h)); // iOS canvas size limit
  const layer = document.createElement('canvas'); layer.width = w * k; layer.height = h * k;
  const g = layer.getContext('2d'); g.setTransform(k, 0, 0, k, -x0 * k, -y0 * k); strokes.forEach((s) => drawStroke(g, s));
  const out = document.createElement('canvas'); out.width = layer.width; out.height = layer.height;
  const o = out.getContext('2d'); o.fillStyle = '#fff'; o.fillRect(0, 0, out.width, out.height); o.drawImage(layer, 0, 0);
  return out;
}
async function shareImage(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file] }); } catch {} return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
$('#bExport').onclick = () => { const c = exportCanvas(); if (!c) return toast("There's nothing to export!"); c.toBlob((b) => shareImage(b, 'drawing.png'), 'image/png'); };

let gallery = store('tt-sk-gallery') || [];
$('#bSend').onclick = () => {
  const c = exportCanvas(); if (!c) return toast('Draw something first');
  const t = document.createElement('canvas'), k = Math.min(1, 900 / Math.max(c.width, c.height));
  t.width = c.width * k; t.height = c.height * k; t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
  const next = [{ id: uid(), at: Date.now(), img: t.toDataURL('image/jpeg', 0.85) }, ...gallery].slice(0, 15);
  try { localStorage.setItem('tt-sk-gallery', JSON.stringify(next)); } catch { return toast('Storage full: delete some gallery items'); } // keep the drawing
  gallery = next;
  pushUndo(); setStrokes([]); toast('Saved to Gallery (test page: not sent to partner)'); openGallery();
};
function openGallery() {
  $('#gitems').innerHTML = gallery.map((g) => `<img src="${g.img}" data-id="${g.id}" alt="">`).join('') || '<p style="color:#888;padding:10px">Nothing yet. Draw and tap Send.</p>';
  $('#gallery').classList.add('open');
}
let viewing = null;
$('#bGallery').onclick = openGallery;
$('#gClose').onclick = () => $('#gallery').classList.remove('open');
$('#gitems').onclick = (e) => { const id = e.target.dataset?.id; if (!id) return; viewing = gallery.find((g) => g.id === id); $('#gimg').src = viewing.img; $('#gview').classList.add('open'); };
$('#gBack').onclick = () => $('#gview').classList.remove('open');
$('#gDel').onclick = () => { gallery = gallery.filter((g) => g !== viewing); store('tt-sk-gallery', gallery); $('#gview').classList.remove('open'); openGallery(); };
$('#gShare').onclick = async () => shareImage(await (await fetch(viewing.img)).blob(), 'drawing.jpg');

let toastT = 0;
function toast(t) { const el = $('#toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => (el.style.opacity = 0), 2200); }

// Automated tests only (draw.html?test): read-only access to state + pure helpers.
if (new URLSearchParams(location.search).has('test')) {
  window.__sk = {
    get strokes() { return strokes; }, get view() { return view; }, get sel() { return sel; }, get tool() { return tool; },
    get undoDepth() { return undoStack.length; }, EDGE, ruler, tools, settings, board,
    inPoly, toRuler, fromRuler, outline, hsl, hexOf, rgb, exportCanvas,
    load(list) { strokes = list.map(finalize); rebuild(); },
  };
}

// ---------------- Boot ----------------
strokes = (store('tt-sk-strokes') || []).map(finalize);
$('#ztext').textContent = Math.round(view.z * 100) + '%';
renderPicker();
addEventListener('resize', fit);
fit();
requestAnimationFrame(frame);
</script>
</body>
</html>
